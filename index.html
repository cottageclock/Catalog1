<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Catalog</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #pdfView, #galleryView {
      position: absolute;
      inset: 0;
    }

    #pdfFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    #galleryView {
      display: none;
      background: #111;
      color: #fff;
    }

    #toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      box-sizing: border-box;
      background: rgba(0,0,0,0.7);
      z-index: 10;
    }

    #title {
      font-size: 14px;
      max-width: calc(100vw - 140px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      border: 0;
      border-radius: 8px;
      background: #333;
      color: #fff;
      width: 40px;
      height: 36px;
      cursor: pointer;
      font-size: 18px;
      margin-left: 6px;
    }

    #viewer {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #photo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      cursor: default;
    }

    #leftTap, #rightTap {
      position: absolute;
      top: 52px;
      bottom: 0;
      width: 50%;
      z-index: 5;
    }
    #leftTap { left: 0; }
    #rightTap { right: 0; }

    #loading, #errorBox {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }

    #fullOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.95);
      z-index: 999;
    }

    #fullOverlay img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }

    #closeFull {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: #333;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="pdfView">
    <iframe id="pdfFrame" title="Catalog PDF"></iframe>
  </div>

  <div id="galleryView">
    <div id="toolbar">
      <div id="title">Gallery</div>
      <div>
        <button class="btn" id="prevBtn" title="Previous">‹</button>
        <button class="btn" id="nextBtn" title="Next">›</button>
        <button class="btn" id="expandBtn" title="Full size">⤢</button>
        <button class="btn" id="closeBtn" title="Close">X</button>
      </div>
    </div>

    <div id="viewer">
      <div id="leftTap"></div>
      <div id="rightTap"></div>
      <img id="photo" alt="Gallery image">
      <div id="loading">Loading…</div>
      <div id="errorBox"></div>
    </div>
  </div>

  <div id="fullOverlay">
    <button id="closeFull">X</button>
    <img id="fullImage" alt="Full size image">
  </div>

  <script>
    const pdfView = document.getElementById("pdfView");
    const galleryView = document.getElementById("galleryView");
    const pdfFrame = document.getElementById("pdfFrame");

    const titleEl = document.getElementById("title");
    const photo = document.getElementById("photo");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("errorBox");
    const fullOverlay = document.getElementById("fullOverlay");
    const fullImage = document.getElementById("fullImage");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const expandBtn = document.getElementById("expandBtn");
    const closeBtn = document.getElementById("closeBtn");
    const closeFull = document.getElementById("closeFull");
    const leftTap = document.getElementById("leftTap");
    const rightTap = document.getElementById("rightTap");

    const pdfUrl = "catalog1.pdf";
    let pdfLoaded = false;

    let images = [];
    let currentIndex = 0;
    let currentFolder = "";

    function showPdf() {
      galleryView.style.display = "none";
      pdfView.style.display = "block";

      if (!pdfLoaded) {
        pdfFrame.src = pdfUrl;
        pdfLoaded = true;
      }
    }

    function showGallery() {
      pdfView.style.display = "none";
      galleryView.style.display = "block";
    }

    function setLoading(on) {
      loading.style.display = on ? "flex" : "none";
    }

    function setError(msg) {
      errorBox.style.display = "flex";
      errorBox.textContent = msg;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function extOk(name) {
      return /\.(jpe?g|png|gif|webp|bmp|avif)$/i.test(name);
    }

    async function loadFolder(folderPath) {
      currentFolder = folderPath;
      setLoading(true);
      clearError();

      const api = `https://api.github.com/repos/cottageclock/Catalog1/contents/${encodeURI(folderPath)}`;
      const res = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });

      if (!res.ok) throw new Error("Could not load folder.");

      const data = await res.json();
      images = (Array.isArray(data) ? data : [])
        .filter(item => item.type === "file" && extOk(item.name))
        .sort((a, b) => a.name.localeCompare(b.name));

      if (!images.length) throw new Error("No images found in that folder.");

      currentIndex = 0;
      renderImage();
      setLoading(false);
    }

    function renderImage() {
      const item = images[currentIndex];
      if (!item) return;

      titleEl.textContent = `${currentIndex + 1} / ${images.length} — ${currentFolder.split("/").pop()}`;
      photo.src = item.download_url;
      photo.alt = item.name;
    }

    function nextImage() {
      if (!images.length) return;
      currentIndex = (currentIndex + 1) % images.length;
      renderImage();
    }

    function prevImage() {
      if (!images.length) return;
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      renderImage();
    }

    function openFull() {
      const item = images[currentIndex];
      if (!item) return;
      fullImage.src = item.download_url;
      fullOverlay.style.display = "flex";
    }

    function closeFullView() {
      fullOverlay.style.display = "none";
      fullImage.src = "";
    }

    function openGallery(folder) {
      history.pushState({ view: "gallery", folder }, "", `?folder=${encodeURIComponent(folder)}`);
      showGallery();
      loadFolder(folder).catch(err => {
        setLoading(false);
        setError(err.message);
      });
    }

    function closeGallery() {
      history.back();
    }

    prevBtn.onclick = prevImage;
    nextBtn.onclick = nextImage;
    leftTap.onclick = prevImage;
    rightTap.onclick = nextImage;
    expandBtn.onclick = openFull;
    closeBtn.onclick = closeGallery;
    closeFull.onclick = closeFullView;

    photo.onclick = openFull;
    fullOverlay.onclick = (e) => {
      if (e.target === fullOverlay) closeFullView();
    };

    document.addEventListener("keydown", (e) => {
      if (galleryView.style.display !== "block") return;

      if (fullOverlay.style.display === "flex") {
        if (e.key === "Escape") closeFullView();
        return;
      }

      if (e.key === "ArrowLeft") prevImage();
      if (e.key === "ArrowRight") nextImage();
      if (e.key === "Escape") closeGallery();
    });

    window.addEventListener("popstate", () => {
      const params = new URLSearchParams(window.location.search);
      const folder = params.get("folder");

      if (folder) {
        showGallery();
        loadFolder(folder).catch(err => {
          setLoading(false);
          setError(err.message);
        });
      } else {
        showPdf();
      }
    });

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    if (folder) {
      showGallery();
      loadFolder(folder).catch(err => {
        setLoading(false);
        setError(err.message);
      });
    } else {
      showPdf();
    }
  </script>
</body>
</html>
